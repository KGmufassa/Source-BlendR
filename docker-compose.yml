services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: source_blendr
      POSTGRES_USER: source_blendr
      POSTGRES_PASSWORD: source_blendr
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_blendr"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - source_blendr_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - source_blendr_redis:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: source_blendr
      MINIO_ROOT_PASSWORD: source_blendr_local
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - source_blendr_minio:/data

volumes:
  source_blendr_postgres:
  source_blendr_redis:
  source_blendr_minio:
