services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: source_blendr
      POSTGRES_USER: source_blendr
      POSTGRES_PASSWORD: source_blendr
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_blendr"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - source_blendr_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - source_blendr_redis:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: source_blendr
      MINIO_ROOT_PASSWORD: source_blendr_local
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - source_blendr_minio:/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://source_blendr:source_blendr@postgres:5432/source_blendr
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: source-blendr
      S3_ACCESS_KEY_ID: source_blendr
      S3_SECRET_ACCESS_KEY: source_blendr_local
      WORKER_CONCURRENCY: 2
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  source_blendr_postgres:
  source_blendr_redis:
  source_blendr_minio:
