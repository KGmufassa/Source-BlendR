<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source Blendr AI Settings</title>
  <style>
    :root { --sb-canvas:#F7F6F2; --sb-surface:#FFFFFF; --sb-text:#1F2421; --sb-muted:#68716B; --sb-border:#D7D9D2; --sb-action:#A85E2A; --sb-focus:#155E75; --sb-success:#2F6B4F; --sb-warning:#8A651D; }
    body { margin:0; background:var(--sb-canvas); color:var(--sb-text); font:14px/1.45 system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible, button:focus-visible { outline:2px solid var(--sb-focus); outline-offset:2px; }
    .shell { min-height:100vh; display:grid; grid-template-columns:248px 1fr; }
    nav { border-right:1px solid var(--sb-border); background:var(--sb-surface); padding:16px; }
    nav a { display:block; padding:8px 10px; border-radius:6px; }
    nav a[aria-current="page"] { border-left:3px solid var(--sb-action); font-weight:600; }
    main { padding:24px; }
    .panel { background:var(--sb-surface); border:1px solid var(--sb-border); border-radius:6px; padding:16px; max-width:760px; }
    .status { display:inline-flex; border:1px solid var(--sb-border); border-radius:999px; padding:4px 8px; color:var(--sb-success); }
    .fallback { color:var(--sb-warning); margin-top:8px; }
    button { border:1px solid var(--sb-border); border-radius:6px; padding:8px 10px; background:var(--sb-surface); }
    .primary { background:var(--sb-action); color:#fff; border-color:var(--sb-action); }
    @media (max-width:767px) { .shell { grid-template-columns:1fr; } nav { border-right:0; border-bottom:1px solid var(--sb-border); } }
  </style>
</head>
<body>
  <div class="shell">
    <nav aria-label="Primary workspace navigation">
      <a href="/app">Overview</a><a href="/app/catalog">Catalog</a><a href="/app/vendors">Vendors</a><a href="/app/settings/ai" aria-current="page">AI Settings</a>
    </nav>
    <main>
      <h1>AI Provider Settings</h1>
      <section class="panel" data-state="manual_fallback">
        <p class="status">local healthy</p>
        <p class="fallback">Manual fallback remains available when no provider is healthy.</p>
        <button type="button">Check provider health</button>
        <button type="button" class="primary">Save AI settings</button>
      </section>
    </main>
  </div>
</body>
</html>
