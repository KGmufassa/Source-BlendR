<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source Blendr Catalog</title>
  <style>
    :root { --sb-canvas:#F7F6F2; --sb-surface:#FFFFFF; --sb-text:#1F2421; --sb-muted:#68716B; --sb-border:#D7D9D2; --sb-action:#A85E2A; --sb-focus:#155E75; }
    body { margin:0; background:var(--sb-canvas); color:var(--sb-text); font:14px/1.45 system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--sb-focus); outline-offset:2px; }
    .shell { min-height:100vh; display:grid; grid-template-columns:248px 1fr; }
    nav { border-right:1px solid var(--sb-border); background:var(--sb-surface); padding:16px; }
    nav a { display:block; padding:8px 10px; border-radius:6px; }
    nav a[aria-current="page"] { border-left:3px solid var(--sb-action); font-weight:600; }
    main { padding:24px; }
    .toolbar { display:flex; gap:8px; align-items:end; margin:16px 0; }
    label { display:grid; gap:4px; color:var(--sb-muted); }
    input { border:1px solid var(--sb-border); border-radius:6px; padding:8px; }
    button, .button { border:1px solid var(--sb-border); border-radius:6px; padding:8px 10px; background:var(--sb-surface); }
    .primary { background:var(--sb-action); color:#fff; border-color:var(--sb-action); }
    table { width:100%; border-collapse:collapse; background:var(--sb-surface); border:1px solid var(--sb-border); }
    th, td { padding:10px; border-bottom:1px solid var(--sb-border); text-align:left; }
    @media (max-width:767px) { .shell { grid-template-columns:1fr; } nav { border-right:0; border-bottom:1px solid var(--sb-border); } table, thead, tbody, tr, td { display:block; } th { display:none; } td::before { content:attr(data-label) ': '; font-weight:600; } }
  </style>
</head>
<body>
  <div class="shell">
    <nav aria-label="Primary workspace navigation">
      <a href="/app">Overview</a><a href="/app/catalog" aria-current="page">Catalog</a><a href="/app/catalog/new">New Item</a><a href="/app/vendors">Vendors</a><a href="/app/settings/ai">AI Settings</a>
    </nav>
    <main>
      <h1>Catalog</h1>
      <div class="toolbar">
        <label>Search catalog <input type="search" value="Tea"></label>
        <button type="button">Filter</button>
        <a class="button primary" href="/app/catalog/new">New item</a>
      </div>
      <table data-mobile-behavior="stacked_labeled_records">
        <thead><tr><th>Name</th><th>SKU</th><th>Price</th></tr></thead>
        <tbody><tr><td data-label="Name">Green Tea</td><td data-label="SKU">TEA-1</td><td data-label="Price">$4.50</td></tr></tbody>
      </table>
    </main>
  </div>
</body>
</html>
